[project]
name = "eventdb-mcp"
version = "0.1.0"
description = "MCP server (FastMCP) and local-LLM chat client for the IntelMQ eventdb"
authors = [
    { name = "aaronkaplan", email = "aaron@lo-res.org" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "fastmcp==4.1.0",
    "openai>=3.32.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain guard: never resolve packages published in the last ~48h.
# Bump deliberately when upgrading dependencies.
exclude-newer = "2026-10-17T00:00:00Z"

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[project.scripts]
eventdb-mcp = "eventdb_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tmp/pytest --cov=eventdb_mcp --cov-report=term-missing"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S608"]

[tool.pylint.format]
max-line-length = 110
