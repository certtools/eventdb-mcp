name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: PostgreSQL server binaries for the test cluster
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql
          echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"
      - run: uv sync --locked --python 3.14
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pylint src
      - run: uv run pylint tests --disable=missing-function-docstring,redefined-outer-name,too-few-public-methods
      - run: uv run pytest
      - run: uv audit

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/secrets --metrics=off --error src tests
